# Déploiement Netlify : le frontend React (Vite).
# IMPORTANT : le backend Socket.IO doit tourner ailleurs (Render, Railway ou VPS)
# car Netlify ne supporte pas les connexions WebSocket persistantes.
#
# À définir dans les env vars Netlify (Site settings > Environment) :
#   VITE_SERVER_URL=https://ton-server.example.com   (avec les WEBSOCKETS activés)

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"
# PWA : le service worker et le manifest ne doivent jamais rester en cache,
# sinon les mises à jour n'arrivent pas.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sécurité (OWASP Secure Headers) pour toutes les pages.
# connect-src autorise l'API et le WebSocket du serveur de jeu (Render).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: wss:; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
