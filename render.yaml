# Blueprint Render — backend NIO FAR + base de données (Socket.IO solidaire)
# Lis au préalable : https://render.com/docs/blueprint-spec

databases:
  - name: niofar-db
    plan: free # Postgres managé — pense à le passer en paid après 30 jours, sinon il expire

services:
  - type: web
    name: nio-far-server
    runtime: node
    rootDir: server
    plan: starter # le free "sleeps" : les WebSocket tombent après ~15 min d'inactivité
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: niofar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://nio-far.netlify.app
    # ⚠️ Remplacer CLIENT_URL par l'URL Netlify réelle (Settings > Site. URL) après création