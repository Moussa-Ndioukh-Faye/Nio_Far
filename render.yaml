# Blueprint Render — backend NIO FAR + base de données
# Spécification : https://render.com/docs/blueprint-spec

databases:
  - name: nio-far-db
    plan: free # ⚠️ l'offre gratuite Render expire après 30 jours (passer en payant ou migrer avant)
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: nio-far-server
    runtime: node
    plan: free # ⚠️ le plan gratuit se met en veille après ~15 min sans visite (réveil ~30 s)
    region: frankfurt
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    # Migrations, puis synchronisation du contenu (ajoute / désactive, ne supprime rien)
    startCommand: npx prisma migrate deploy && npx prisma db seed && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: nio-far-db
          property: connectionString
      # Adresses du frontend autorisées, séparées par des virgules
      - key: CLIENT_URL
        value: https://nio-far.netlify.app,https://nio-far.vercel.app
